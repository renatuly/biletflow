# Render Blueprint: FastAPI backend + free Postgres.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked sync:false
# are prompted for on first deploy.
services:
  - type: web
    name: biletflow-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DATABASE_URL
        fromDatabase:
          name: biletflow-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      # Public URL of the Vercel web app, e.g. https://biletflow-web.vercel.app
      - key: APP_FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: BiletFlow
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: biletflow-db
    plan: free
    region: frankfurt
    databaseName: biletflow
    user: biletflow
