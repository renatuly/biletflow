[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biletflow"
version = "0.1.0"
description = "Backend API for the BiletFlow academic MVP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anyio>=4.4,<4.12",
    "fastapi>=0.115,<0.116",
    "email-validator>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "qrcode[pil]>=8.0,<9.0",
    "reportlab>=4.2,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8.3,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
