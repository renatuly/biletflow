services:
  api:
    build: .
    environment:
      APP_DATABASE_URL: postgresql+psycopg://biletflow:biletflow@db:5432/biletflow
      APP_SECRET_KEY: local-demonstration-secret-change-before-deployment
      APP_FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biletflow
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
